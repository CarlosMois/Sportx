<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportX - Crear Cuenta</title>
    <link rel="stylesheet" href="/Sportx/Registro/registro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        
        <div class="brand-header">
            <!-- LOGO EN LUGAR DEL EMOJI -->
            <div class="logo-icon">
                <img src="/Sportx/img/Imagenes Inicio/IMG-20260529-WA0008_2_-removebg-preview.png" alt="SportX Logo">
            </div>
            <p class="brand-subtitle">Únete a nuestra comunidad deportiva</p>
        </div>

        <form class="login-form" action="#" method="POST">
            
            <div class="input-group">
                <label for="fullname">Nombre Completo</label>
                <input type="text" id="fullname" placeholder="Juan Pérez" required>
            </div>

            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@deporte.com" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit">Registrarse</button>
        </form>

        <div class="login-footer">
            <p>¿Ya tienes una cuenta? <a href="/Sportx/Inicio de sesión/index.html">Inicia sesión aquí</a></p>
        </div>

    </div>
</body>
</html>
