<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportX - Iniciar Sesión</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="login-container">
<div class="brand-header">
<div class="logo-icon">🏆</div>
<h1 class="brand-title">SportX</h1>
<p class="brand-subtitle">Tu plataforma deportiva</p>
</div>
<form class="login-form" action="#" method="POST">
<div class="input-group">
<label for="email">Correo Electrónico</label>
<input type="email" id="email" placeholder="ejemplo@deporte.com" required>
</div>
<div class="input-group">
<label for="password">Contraseña</label>
<input type="password" id="password" placeholder="••••••••" required>
</div>

<button type="submit" class="btn-submit">Ingresar</button>
</form>
<div class="login-footer">
<p>¿No tienes una cuenta? <a href="../Registro/registro.html">Regístrate aquí</a></p>
</div>
</div>
</body>
</html>
